group 'info.gianlucacosta.osgitest.hotswap'
version '1.0'

apply plugin: 'scala'
apply plugin: 'osgi'


dependencies {
    compile 'org.apache.felix:org.apache.felix.framework:5.4.0'
    compile 'org.scala-lang:scala-library:2.11.7'

    compile project(':hotswap-message')
}


jar {
    manifest {
        instruction 'Bundle-RequiredExtensionEnvironment',
                'JavaSE-1.8'

        instruction 'Export-Package',
                '!info.gianlucacosta.*',
                '*';


        instruction 'Bundle-Activator',
                'info.gianlucacosta.osgitest.hotswap.gui.GuiActivator'
    }
}