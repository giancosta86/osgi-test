group 'info.gianlucacosta.osgitest'
version '1.0'

apply plugin: 'osgi'


dependencies {
    compile 'org.apache.felix:org.apache.felix.framework:5.4.0'
}


jar {
    manifest {
        instruction 'Export-Package',
                '!info.gianlucacosta.osgitest.engine.*',
                '*'


        instruction 'Bundle-Description',
                'First OSGi example'

        instruction 'Bundle-Activator',
                'info.gianlucacosta.osgitest.hello.HelloActivator'
    }
}